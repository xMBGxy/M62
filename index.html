<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MTG Multivariate Probability Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: auto;
      line-height: 1.4;
    }
    h1, h2 {
      text-align: center;
    }
    .controls, .types, .actions {
      margin: 20px 0;
    }
    .controls label, .types input {
      margin-right: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    button {
      margin-right: 10px;
      padding: 6px 12px;
      font-size: 14px;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>MTG Multivariate Probability Simulator</h1>

  <div class="controls">
    <label>Deck Size (N):
      <input type="number" id="deckSize" min="1" value="60">
    </label>
    <label>Cards Drawn (n):
      <input type="number" id="handSize" min="1" value="7">
    </label>
    <label>Trials:
      <input type="number" id="trials" min="1000" step="1000" value="10000">
    </label>
  </div>

  <h2>Card Types & Thresholds</h2>
  <div class="types">
    <table id="typesTable">
      <thead>
        <tr>
          <th>Card Name</th>
          <th>Copies in Deck</th>
          <th>Min Drawn</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button id="addTypeBtn">Add Card Type</button>
  </div>

  <div class="actions">
    <button id="calculateBtn">Calculate Probability</button>
  </div>

  <div id="result"></div>

  <script>
    const typesTableBody = document.querySelector('#typesTable tbody');
    const deckSizeInput  = document.getElementById('deckSize');
    const handSizeInput  = document.getElementById('handSize');
    const trialsInput    = document.getElementById('trials');
    const addTypeBtn     = document.getElementById('addTypeBtn');
    const calculateBtn   = document.getElementById('calculateBtn');
    const resultDiv      = document.getElementById('result');

    // Add a new row for a card type
    function addTypeRow(name = '', copies = 4, threshold = 1) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="text" class="type-name" value="${name}" placeholder="e.g. Counterspell"></td>
        <td><input type="number" class="type-copies" min="0" value="${copies}"></td>
        <td><input type="number" class="type-threshold" min="0" value="${threshold}"></td>
        <td><button class="remove-btn">×</button></td>
      `;
      typesTableBody.appendChild(tr);
      tr.querySelector('.remove-btn').onclick = () => {
        typesTableBody.removeChild(tr);
      };
    }

    // Fisher–Yates shuffle
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    // Run Monte Carlo simulation
    function simulate() {
      const N      = parseInt(deckSizeInput.value, 10);
      const n      = parseInt(handSizeInput.value, 10);
      const trials = parseInt(trialsInput.value,  10);

      // Gather types
      const rows = Array.from(typesTableBody.querySelectorAll('tr'));
      const types = rows.map(row => {
        return {
          name:      row.querySelector('.type-name').value.trim() || 'Type',
          copies:    parseInt(row.querySelector('.type-copies').value, 10),
          threshold: parseInt(row.querySelector('.type-threshold').value, 10)
        };
      });

      // Build deck template: indices for each type, plus 'O' for others
      let deckTemplate = [];
      types.forEach((t, idx) => {
        for (let i = 0; i < t.copies; i++) deckTemplate.push(idx);
      });
      const others = N - deckTemplate.length;
      for (let i = 0; i < others; i++) deckTemplate.push('O');

      let success = 0;
      for (let t = 0; t < trials; t++) {
        const deck = deckTemplate.slice();
        shuffle(deck);
        const hand = deck.slice(0, n);
        // Count drawn per type
        const counts = types.map((_, idx) =>
          hand.filter(c => c === idx).length
        );
        // Check all thresholds
        const ok = counts.every((cnt, i) => cnt >= types[i].threshold);
        if (ok) success++;
      }

      const prob = (success / trials * 100).toFixed(2);
      resultDiv.textContent =
        `Estimated probability: ${prob}% (over ${trials} trials)`;
    }

    // Initialize with two default types
    addTypeRow('Card A', 4, 1);
    addTypeRow('Card B', 4, 1);

    addTypeBtn.addEventListener('click', () => addTypeRow());
    calculateBtn.addEventListener('click', simulate);
  </script>
</body>
</html>
